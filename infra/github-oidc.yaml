AWSTemplateFormatVersion: '2010-09-09'
Description: GitHub Actions OIDC provider and scoped SageMaker Pipeline role for this fork.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  'com.aws.cloudformation.Context':
    Purpose: Let the fork prove keyless AWS authentication and manually start its SageMaker Pipeline.
    Design: Trust only the immutable GitHub subject for master; allow only DescribePipeline and StartPipelineExecution on one pipeline.
    Operations: The training workflow first performs a read-only check; an explicit workflow input starts billable jobs.
Resources:
  GithubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: Project
          Value: bigdata-ids-capstone
  GithubSmokeRole:
    Type: AWS::IAM::Role
    Properties:
      Description: GitHub Actions identity check and manually triggered IDS training for fork master.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GithubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:galaxyofmind@221684358/ml-ids-zero-trust-cloud@1386557472:ref:refs/heads/master
      Policies:
        - PolicyName: StartIdsPipeline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DescribeAndStartOnlyIdsPipeline
                Effect: Allow
                Action:
                  - sagemaker:DescribePipeline
                  - sagemaker:StartPipelineExecution
                Resource: !Sub 'arn:${AWS::Partition}:sagemaker:${AWS::Region}:${AWS::AccountId}:pipeline/bigdata-ids-dev-train'
      Tags:
        - Key: Project
          Value: bigdata-ids-capstone
Outputs:
  GithubOidcProviderArn:
    Description: IAM GitHub OIDC provider ARN.
    Value: !Ref GithubOidcProvider
  AwsSmokeRoleArn:
    Description: Use this scoped role ARN for GitHub Actions variable AWS_ROLE_ARN.
    Value: !GetAtt GithubSmokeRole.Arn
