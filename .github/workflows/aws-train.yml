name: AWS train (manual)

on:
  workflow_dispatch:
    inputs:
      start_training:
        description: Start billable SageMaker Processing jobs after the identity check
        required: true
        type: boolean
        default: false
      model_name:
        description: NSL-KDD model to train when start_training is true
        required: true
        type: choice
        options:
          - random_forest
          - svm
          - xgboost
          - lstm
        default: random_forest

permissions:
  id-token: write
  contents: read

jobs:
  pipeline:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1
      - name: Select pipeline
        env:
          MODEL_NAME: ${{ inputs.model_name }}
        run: |
          case "$MODEL_NAME" in
            random_forest|svm) pipeline=bigdata-ids-dev-train ;;
            xgboost) pipeline=bigdata-ids-dev-xgboost ;;
            lstm) pipeline=bigdata-ids-dev-lstm ;;
            *) exit 2 ;;
          esac
          echo "PIPELINE_NAME=$pipeline" >> "$GITHUB_ENV"
      - name: Check AWS identity and pipeline
        run: |
          aws sts get-caller-identity
          aws sagemaker describe-pipeline \
            --pipeline-name "$PIPELINE_NAME" \
            --query '{Name:PipelineName,Status:PipelineStatus}'
      - name: Start model training
        if: inputs.start_training
        env:
          MODEL_NAME: ${{ inputs.model_name }}
        run: |
          if [ "$MODEL_NAME" = "lstm" ]; then
            aws sagemaker start-pipeline-execution \
              --pipeline-name "$PIPELINE_NAME" \
              --pipeline-parameters \
                Name=MaxTrainFlows,Value=40000 \
                Name=Epochs,Value=12 \
              --pipeline-execution-display-name "GitHub-${MODEL_NAME}-${GITHUB_RUN_ID}" \
              --query PipelineExecutionArn
          else
            if [ "$MODEL_NAME" = "svm" ]; then
              train_rows=8000
            else
              train_rows=30000
            fi
            aws sagemaker start-pipeline-execution \
              --pipeline-name "$PIPELINE_NAME" \
              --pipeline-parameters \
                Name=ModelName,Value="$MODEL_NAME" \
                Name=TrainRows,Value="$train_rows" \
              --pipeline-execution-display-name "GitHub-${MODEL_NAME}-${GITHUB_RUN_ID}" \
              --query PipelineExecutionArn
          fi
