name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python -m compileall -q src api dashboard
      - name: Check CloudFormation syntax
        run: |
          python -m pip install 'cfn-lint>=1,<2'
          cfn-lint infra/foundation.yaml
